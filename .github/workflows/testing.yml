name: Testing
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  test:
    name: Testing on
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11", "pypy-3.10"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv + caching
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            tox.ini
            pyproject.toml
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: uvx --with flake8 pytest run_tests.py

  lint:
    name: Lint code
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv + caching
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            tox.ini
            pyproject.toml
          python-version: ${{ matrix.python-version }}
      - name: Run linting
        run: uvx prek run -a
